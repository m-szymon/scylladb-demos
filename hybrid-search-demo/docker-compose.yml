# Single-node ScyllaDB + Vector Store from published images: the scylla-nightly build of the
# scylladb submodule's commit and the vector-store release the vector-store submodule is pinned on.
# SCYLLA_IMAGE and VECTOR_STORE_IMAGE override them, e.g. with the localhost/scylla-hybrid:dev and
# localhost/vector-store-hybrid:dev that ./build-images.sh builds from the submodules.
services:
  scylla:
    image: ${SCYLLA_IMAGE:-docker.io/scylladb/scylla-nightly:2026.4.0-dev-0.20261013.09445539ad64}
    container_name: hybrid-demo-scylla
    command: >
      --smp 2
      --memory 1G
      --overprovisioned 1
      --developer-mode 1
      --vector-store-primary-uri http://vector-store:6080
      --experimental-features udf
      --enable-user-defined-functions 1
    ports:
      - "9042:9042"
    volumes:
      - ./:/demo:z,ro
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local'"]
      interval: 5s
      timeout: 10s
      retries: 30
    networks:
      - hybrid-net

  vector-store:
    image: ${VECTOR_STORE_IMAGE:-docker.io/scylladb/vector-store:1.12.0}
    container_name: hybrid-demo-vector-store
    environment:
      VECTOR_STORE_URI: "0.0.0.0:6080"
      VECTOR_STORE_SCYLLADB_URI: "scylla:9042"
    ports:
      - "6080:6080"
    depends_on:
      scylla:
        condition: service_healthy
    networks:
      - hybrid-net

networks:
  hybrid-net:
    driver: bridge
