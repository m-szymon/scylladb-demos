<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The path of a LIKE query through ScyllaDB and the index node">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect width="980" height="400" rx="10" fill="#f8f9fb"/>
<rect x="20" y="60" width="170" height="110" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="34" y="85" font-size="15" fill="#1f2933" font-weight="600">Client</text>
<text x="34" y="108" font-size="13" fill="#52606d">SELECT ... WHERE</text>
<text x="34" y="127" font-size="13" fill="#52606d">name LIKE &#39;%ali%&#39;</text>
<text x="34" y="146" font-size="13" fill="#52606d">LIMIT 20</text>
<rect x="300" y="40" width="230" height="150" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="314" y="65" font-size="15" fill="#1f2933" font-weight="600">ScyllaDB, the coordinator</text>
<text x="314" y="88" font-size="13" fill="#52606d">picks the index whose order</text>
<text x="314" y="107" font-size="13" fill="#52606d">fits the query; asks the index</text>
<text x="314" y="126" font-size="13" fill="#52606d">node for a page of keys;</text>
<text x="314" y="145" font-size="13" fill="#52606d">tops a short page up</text>
<rect x="300" y="270" width="230" height="104" rx="8" fill="#ffffff" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="314" y="295" font-size="15" fill="#1f2933" font-weight="600">ScyllaDB, the replicas</text>
<text x="314" y="318" font-size="13" fill="#52606d">hold the rows: read by key,</text>
<text x="314" y="337" font-size="13" fill="#52606d">wherever on the ring they are</text>
<rect x="712" y="40" width="248" height="334" rx="8" fill="#eef4ff" stroke="#2f6fde" stroke-width="1.5"/>
<text x="726" y="65" font-size="15" fill="#1f2933" font-weight="600">Index node (vector-store)</text>
<text x="726" y="88" font-size="13" fill="#1f2933" font-weight="600">1</text>
<text x="744" y="88" font-size="13" fill="#52606d">split the pattern into grams</text>
<text x="744" y="107" font-size="13" fill="#52606d">&#39;ali&#39;</text>
<text x="726" y="126" font-size="13" fill="#1f2933" font-weight="600">2</text>
<text x="744" y="126" font-size="13" fill="#52606d">walk the segments in the</text>
<text x="744" y="145" font-size="13" fill="#52606d">index&#39;s order, skipping</text>
<text x="744" y="164" font-size="13" fill="#52606d">what cannot match</text>
<text x="726" y="183" font-size="13" fill="#1f2933" font-weight="600">3</text>
<text x="744" y="183" font-size="13" fill="#52606d">check each candidate</text>
<text x="744" y="202" font-size="13" fill="#52606d">against the stored value</text>
<text x="726" y="221" font-size="13" fill="#1f2933" font-weight="600">4</text>
<text x="744" y="221" font-size="13" fill="#52606d">stop at 20 rows, or when</text>
<text x="744" y="240" font-size="13" fill="#52606d">the request&#39;s budget of</text>
<text x="744" y="259" font-size="13" fill="#52606d">time ends</text>
<text x="726" y="297" font-size="13" fill="#52606d">answers 20 keys in order,</text>
<text x="726" y="316" font-size="13" fill="#52606d">and a cursor for the next page</text>
<line x1="190" y1="95" x2="298" y2="95" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<text x="244" y="86" text-anchor="middle" font-size="12.5" fill="#1f2933"><tspan font-weight="700">1</tspan>  query</text>
<line x1="530" y1="85" x2="710" y2="85" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<text x="620" y="76" text-anchor="middle" font-size="12.5" fill="#1f2933"><tspan font-weight="700">2</tspan>  pattern, limit, cursor</text>
<line x1="710" y1="150" x2="532" y2="150" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<text x="620" y="141" text-anchor="middle" font-size="12.5" fill="#1f2933"><tspan font-weight="700">3</tspan>  keys, next cursor</text>
<line x1="415" y1="190" x2="415" y2="268" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<text x="426" y="234" text-anchor="start" font-size="12.5" fill="#1f2933"><tspan font-weight="700">4</tspan>  read the rows</text>
<line x1="298" y1="140" x2="192" y2="140" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<text x="244" y="131" text-anchor="middle" font-size="12.5" fill="#1f2933"><tspan font-weight="700">5</tspan>  page</text>
</svg>
