<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="An expensive page served by several short requests">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs>
<rect width="800" height="330" rx="10" fill="#f8f9fb"/>
<text x="400" y="32" font-size="15" fill="#1f2933" text-anchor="middle">A page of 20 that is expensive to fill: three requests of at most 50 ms each.</text>
<text x="60" y="70" font-size="14" fill="#1f2933" font-weight="600">Index node</text>
<rect x="60" y="86" width="200" height="34" rx="5" fill="#dbe7fb" stroke="#2f6fde" stroke-width="1.5"/>
<text x="160.0" y="108" font-size="13" fill="#1f2933" text-anchor="middle">request 1: 7 rows</text>
<line x1="260" y1="80" x2="260" y2="126" stroke="#c0392b" stroke-width="2"/>
<text x="260" y="142" font-size="12" fill="#c0392b" text-anchor="middle">50 ms: stop,</text>
<text x="260" y="158" font-size="12" fill="#c0392b" text-anchor="middle">return a cursor</text>
<line x1="264" y1="103" x2="288" y2="103" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="290" y="86" width="200" height="34" rx="5" fill="#dbe7fb" stroke="#2f6fde" stroke-width="1.5"/>
<text x="390.0" y="108" font-size="13" fill="#1f2933" text-anchor="middle">request 2: no rows</text>
<line x1="490" y1="80" x2="490" y2="126" stroke="#c0392b" stroke-width="2"/>
<text x="490" y="142" font-size="12" fill="#c0392b" text-anchor="middle">50 ms: stop,</text>
<text x="490" y="158" font-size="12" fill="#c0392b" text-anchor="middle">return a cursor</text>
<line x1="494" y1="103" x2="518" y2="103" stroke="#1f2933" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="520" y="86" width="130" height="34" rx="5" fill="#dbe7fb" stroke="#2f6fde" stroke-width="1.5"/>
<text x="585.0" y="108" font-size="13" fill="#1f2933" text-anchor="middle">request 3: 13 rows</text>
<text x="60" y="208" font-size="14" fill="#1f2933" font-weight="600">ScyllaDB</text>
<rect x="60" y="220" width="590" height="34" rx="5" fill="#d8f0e5" stroke="#2a9d6f" stroke-width="1.5"/>
<text x="355" y="242" font-size="13" fill="#1f2933" text-anchor="middle">follows the cursor until the page has its 20 rows, then answers the client</text>
<text x="60" y="290" font-size="13" fill="#52606d">No request holds a thread of the index node for more than about 50 ms.</text>
<text x="60" y="310" font-size="13" fill="#52606d">A paged query that is not full after half of its timeout is handed over as it is, with more to come.</text>
</svg>
