<text x="76" y="208" font-size="13" fill="#52606d">A row deleted or added before the cursor moves nothing: page 2 still starts right after that row.</text>
<text x="76" y="230" font-size="13" fill="#52606d">A page number or an offset would shift, and skip a row or show one twice.</text>
